<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WALL STREET LIFE 城市地圖</title>
<meta name="description" content="WALL STREET LIFE 開發中的金融城市 3D 地圖與開發日誌">
<!-- CITY MAP 01: public 3D city map (city exterior only, exported from the game with devtools __CITYEXPORT). Not part of the game build. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>
:root{--bg:#0e1116;--panel:#151a21;--panel2:#1c222b;--fg:#ece7dc;--mut:#9aa1ab;--line:#2a313b;--acc:#d4a84b;--acc2:#6fb3d9;--good:#59b37a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.6 "Noto Sans TC",system-ui,sans-serif}
#app{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}
#view{position:relative;min-width:0;overflow:hidden}
#c{width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;font-weight:500;color:#fff;background:rgba(14,17,22,.78);border:1px solid rgba(212,168,75,.55);padding:2px 8px;border-radius:999px;pointer-events:auto;cursor:pointer}
.lbl::after{content:"";position:absolute;left:50%;bottom:-6px;width:1px;height:6px;background:rgba(212,168,75,.7)}
.lbl.dist{background:none;border:none;color:rgba(236,231,220,.72);font-size:13px;letter-spacing:.12em;text-shadow:0 1px 3px #000;cursor:default;pointer-events:none}
.lbl.dist::after{display:none}
#top{position:absolute;left:16px;top:calc(16px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap}
.btn{background:rgba(21,26,33,.88);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.btn.on{background:var(--acc);color:#1b1607;border-color:var(--acc)}
#card{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:320px;background:rgba(21,26,33,.94);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:none}
#card h3{margin:0 0 4px;font-size:15px}#card .tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:rgba(89,179,122,.18);color:#8fd6a6;margin-right:6px}
#card .tag.plan{background:rgba(154,161,171,.18);color:var(--mut)}#card p{margin:6px 0 0;color:var(--mut);font-size:13px}
#load{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:5}
#load .box{width:min(320px,80%);text-align:center}#load .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:12px}#load .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding-block:20px;padding-inline:20px}
#side h1{font:700 22px/1.3 "Noto Serif TC",serif;margin:0;letter-spacing:.04em}
#side .sub{color:var(--acc);font-size:12px;letter-spacing:.2em;margin-top:2px}
#side .intro{color:var(--mut);font-size:13px;margin:10px 0 0}
#side h2{font-size:13px;color:var(--acc);letter-spacing:.14em;margin:22px 0 10px;font-weight:700}
.help{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;color:var(--mut)}.help b{color:var(--fg);font-weight:500}
.log{border-left:2px solid var(--line);padding-left:14px;margin-left:4px}
.entry{position:relative;margin-bottom:18px}.entry::before{content:"";position:absolute;left:-20px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--panel)}
.entry .date{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}.entry h4{margin:2px 0 6px;font-size:15px}
.entry ul{margin:0;padding-left:18px;color:#cfc9bd;font-size:13px}.entry li{margin:3px 0}
.entry img{width:100%;border-radius:8px;margin-top:8px;border:1px solid var(--line)}
.places{display:flex;flex-wrap:wrap;gap:6px}.places button{font-size:12px;padding:4px 10px}
.foot{color:var(--mut);font-size:12px;margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto;min-height:100%}#side{border-left:none;border-top:1px solid var(--line)}html,body{height:auto}}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="c" tabindex="0" aria-label="WALL STREET LIFE 城市 3D 地圖"></canvas>
    <div id="labels"></div>
    <div id="top">
      <button class="btn on" id="bDay">白天</button><button class="btn" id="bNight">夜晚</button>
      <button class="btn" id="bTop">鳥瞰</button><button class="btn" id="bStreet">街道</button>
      <button class="btn on" id="bLbl">標籤</button>
    </div>
    <div id="card"><h3 id="cName"></h3><div id="cTags"></div><p id="cText"></p></div>
    <div id="load"><div class="box"><div>載入城市中…</div><div class="bar"><i id="lbar"></i></div><div id="lmsg" style="color:var(--mut);font-size:12px;margin-top:8px"></div></div></div>
  </div>
  <aside id="side">
    <h1>WALL STREET LIFE</h1>
    <div class="sub">金融城市 · 開發中地圖</div>
    <p class="intro">這是遊戲裡的城市，直接從開發版匯出的外觀。這裡只看得到建築與街道；室內、角色和玩法都在遊戲裡。</p>
    <h2>操作</h2>
    <div class="help"><b>旋轉</b><span>左鍵拖曳／單指拖曳</span><b>平移</b><span>右鍵拖曳／雙指拖曳</span><b>縮放</b><span>滾輪／雙指縮放</span><b>看介紹</b><span>點地標標籤或建築</span></div>
    <h2>地標</h2>
    <div class="places" id="places"></div>
    <h2>開發日誌</h2>
    <div class="log" id="log"></div>
    <div class="foot">畫面是開發中版本，內容會隨開發改變。<br><span id="ver"></span></div>
  </aside>
</div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
